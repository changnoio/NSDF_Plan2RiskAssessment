  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

px);border-bottom:1px solid var(--border)\">\n    <div onclick=\"{{ goHome }}\" style=\"display:flex;align-items:center;gap:13px;cursor:pointer;min-width:0\">\n      <div style=\"width:46px;height:46px;border-radius:13px;background:#fff;display:flex;align-items:center;justify-content:center;box-shadow:0 4px 14px rgba(28,40,95,.18);flex:none;overflow:hidden\">\n        <img src=\"d9efa96e-266d-46d8-af4e-58fb2e5d9c69\" alt=\"NSDF\" style=\"width:40px;height:40px;object-fit:contain\">\n      <\u002Fdiv>\n      <div style=\"min-width:0\">\n        <div style=\"font-weight:700;font-size:15px;letter-spacing:.2px;line-height:1.15\">กองทุนพัฒนาการกีฬาแห่งชาติ<\u002Fdiv>\n        <div style=\"font-size:11.5px;color:var(--ink2);font-weight:500;letter-spacing:.3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis\">NSDF · แดชบอร์ดวิเคราะห์คำขอรับการสนับสนุน<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"flex:1\"><\u002Fdiv>\n    <nav style=\"display:flex;align-items:center;gap:8px;font-size:13px;color:var(--ink2)\">\n      <span onclick=\"{{ goHome }}\" style=\"cursor:pointer;padding:7px 14px;border-radius:99px;font-weight:600;background:var(--surface2);border:1px solid var(--border);white-space:nowrap\">หน้าแรก<\u002Fspan>\n      <button onclick=\"{{ toggleTheme }}\" aria-label=\"สลับธีม\" style=\"width:40px;height:40px;border-radius:99px;border:1px solid var(--border);background:var(--surface2);color:var(--ink);cursor:pointer;display:flex;align-items:center;justify-content:center;padding:0\">\n        <sc-if value=\"{{ isLight }}\" hint-placeholder-val=\"{{ true }}\">\n          <svg width=\"18\" height=\"18\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z\"><\u002Fpath><\u002Fsvg>\n        <\u002Fsc-if>\n        <sc-if value=\"{{ isDark }}\" hint-placeholder-val=\"{{ true }}\">\n          <svg width=\"19\" height=\"19\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><circle cx=\"12\" cy=\"12\" r=\"4.2\"><\u002Fcircle><path d=\"M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4\"><\u002Fpath><\u002Fsvg>\n        <\u002Fsc-if>\n      <\u002Fbutton>\n    <\u002Fnav>\n  <\u002Fheader>\n\n  <main style=\"max-width:1120px;margin:0 auto;padding:0 clamp(16px,4vw,40px)\">\n\n  <!-- ============ HOME ============ -->\n  <sc-if value=\"{{ isHome }}\" hint-placeholder-val=\"{{ true }}\">\n  <div style=\"animation:fadeUp .5s ease\">\n    <section style=\"position:relative;margin-top:26px;border-radius:26px;overflow:hidden;background:var(--grad);color:#fff;padding:clamp(30px,5vw,54px);box-shadow:0 24px 60px rgba(28,40,95,.30)\">\n      <div style=\"position:absolute;right:-70px;top:-70px;width:280px;height:280px;border-radius:50%;background:radial-gradient(circle,rgba(255,255,255,.16),transparent 70%);animation:floaty 7s ease-in-out infinite\"><\u002Fdiv>\n      <div style=\"position:absolute;right:120px;bottom:-90px;width:220px;height:220px;border-radius:50%;background:radial-gradient(circle,rgba(210,38,26,.5),transparent 68%)\"><\u002Fdiv>\n      <div style=\"position:relative;max-width:760px\">\n        <div style=\"display:inline-flex;align-items:center;gap:8px;padding:6px 14px;border-radius:99px;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.25);font-size:12.5px;font-weight:600;letter-spacing:.4px\">แผนที่ 2 · ประจำปีงบประมาณ 2570<\u002Fdiv>\n        <h1 style=\"margin:18px 0 0;font-size:clamp(27px,4.6vw,44px);line-height:1.14;font-weight:700;letter-spacing:-.2px\">การวิเคราะห์คำขอรับการ<br>สนับสนุนงบประมาณ<\u002Fh1>\n        <p style=\"margin:18px 0 0;font-size:clamp(14.5px,1.7vw,17px);line-height:1.75;color:rgba(255,255,255,.9);text-wrap:pretty\">เพื่อแสดงตัวอย่างการวิเคราะห์คำขอเบื้องต้นตามแนวทางการวินิจฉัยของคณะอนุกรรมการกลั่นกรอง และคณะกรรมการบริหารกองทุนพัฒนาการกีฬาแห่งชาติ โดยมีเป้าหมายให้สมาคมกีฬาแห่งประเทศไทยนำผลการวิเคราะห์กลับไปปรับปรุงคำขอฯ เพื่อให้คำขอมีความครบถ้วน สมบูรณ์ มีประสิทธิภาพ และได้รับการจัดสรรตามกิจกรรมที่เสนอ<br><i>หมายเหตุ : กองทุนฯ วิเคราะห์คำขอเบื้องต้นสมาคมละ 1 คำขอเท่านั้น เพื่อเป็นตัวอย่างและแนวทางการปรับแก้ไข<\u002Fi><\u002Fp>\n        <div style=\"margin-top:22px;display:inline-flex;align-items:center;gap:10px;padding:9px 16px;border-radius:14px;background:rgba(0,0,0,.16);font-size:13px\">\n          <svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\"><path d=\"M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z\"><\u002Fpath><\u002Fsvg>\n          <span>ผลการวิเคราะห์จัดทำโดย <b>เจ้าหน้าที่กองทุนพัฒนาการกีฬาแห่งชาติ (NSDF)<\u002Fb><\u002Fspan>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsection>\n\n    <section style=\"margin-top:22px;display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:16px\">\n      <div style=\"background:var(--surface);border:1px solid var(--border);border-radius:18px;box-shadow:var(--shadow);padding:20px\">\n        <div style=\"font-size:12.5px;color:var(--ink2);font-weight:600\">สมาคมที่วิเคราะห์แล้ว<\u002Fdiv>\n        <div style=\"font-size:34px;font-weight:700;margin-top:6px;font-variant-numeric:tabular-nums\">{{ ov.total }} <span style=\"font-size:15px;color:var(--ink3);font-weight:600\">สมาคม<\u002Fspan><\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"background:var(--surface);border:1px solid var(--border);border-radius:18px;box-shadow:var(--shadow);padding:20px\">\n        <div style=\"font-size:12.5px;color:var(--ink2);font-weight:600\">งบประมาณที่ขอรวม<\u002Fdiv>\n        <div style=\"font-size:29px;font-weight:700;margin-top:6px;font-variant-numeric:tabular-nums\">{{ ov.budget }}<\u002Fdiv>\n        <div style=\"font-size:12px;color:var(--ink3)\">บาท<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"background:var(--surface);border:1px solid var(--border);border-radius:18px;box-shadow:var(--shadow);padding:20px\">\n        <div style=\"font-size:12.5px;color:var(--ink2);font-weight:600\">วงเงินแนะนำอนุมัติรวม<\u002Fdiv>\n        <div style=\"font-size:29px;font-weight:700;margin-top:6px;color:var(--ok);font-variant-numeric:tabular-nums\">{{ ov.recommend }}<\u002Fdiv>\n        <div style=\"font-size:12px;color:var(--ink3)\">บาท · เฉลี่ย {{ ov.avgPct }}% ของคำขอ<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"background:var(--surface);border:1px solid var(--border);border-radius:18px;box-shadow:var(--shadow);padding:20px\">\n        <div style=\"font-size:12.5px;color:var(--ink2);font-weight:600\">ระดับความเสี่ยง<\u002Fdiv>\n        <div style=\"display:flex;gap:14px;margin-top:12px\">\n          <div style=\"text-align:center\"><div style=\"font-size:22px;font-weight:700;color:var(--bad)\">{{ ov.high }}<\u002Fdiv><div style=\"font-size:11px;color:var(--ink3)\">สูง<\u002Fdiv><\u002Fdiv>\n          <div style=\"text-align:center\"><div style=\"font-size:22px;font-weight:700;color:var(--warn)\">{{ ov.medium }}<\u002Fdiv><div style=\"font-size:11px;color:var(--ink3)\">กลาง<\u002Fdiv><\u002Fdiv>\n          <div style=\"text-align:center\"><div style=\"font-size:22px;font-weight:700;color:var(--ok)\">{{ ov.low }}<\u002Fdiv><div style=\"font-size:11px;color:var(--ink3)\">ต่ำ<\u002Fdiv><\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsection>\n\n    <section style=\"margin-top:34px\">\n      <div style=\"display:flex;align-items:baseline;gap:12px;margin-bottom:16px\">\n        <h2 style=\"margin:0;font-size:20px;font-weight:700\">เลือกวันประชุมเชิงปฏิบัติการ (Workshop)<\u002Fh2>\n        <span style=\"font-size:13px;color:var(--ink2)\">คลิกวันที่มีข้อมูลเพื่อดูรายชื่อสมาคมกีฬาฯ<\u002Fspan>\n      <\u002Fdiv>\n      <div style=\"display:grid;grid-template-columns:repeat(auto-fill,minmax(215px,1fr));gap:14px\">\n        <sc-for list=\"{{ dates }}\" as=\"d\" hint-placeholder-count=\"10\">\n          <div onclick=\"{{ d.open }}\" style=\"position:relative;background:var(--surface);border:1px solid var(--border);border-radius:18px;box-shadow:var(--shadow);padding:18px 18px 16px;cursor:pointer;transition:transform .18s ease,box-shadow .18s ease,border-color .18s ease;overflow:hidden\" style-hover=\"transform:translateY(-4px);box-shadow:0 22px 46px rgba(28,40,95,.16);border-color:color-mix(in srgb,var(--blue) 45%,var(--border))\">\n            <div style=\"display:flex;justify-content:space-between;align-items:flex-start;gap:10px\">\n              <div>\n                <div style=\"font-size:11px;font-weight:600;letter-spacing:.5px;color:var(--ink3);text-transform:uppercase\">{{ d.session }}<\u002Fdiv>\n                <div style=\"font-size:17px;font-weight:700;margin-top:3px\">{{ d.label }}<\u002Fdiv>\n              <\u002Fdiv>\n              <div style=\"width:34px;height:34px;border-radius:10px;display:flex;align-items:center;justify-content:center;background:var(--surface2);border:1px solid var(--border);flex:none\">\n                <svg width=\"17\" height=\"17\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"var(--ink2)\" stroke-width=\"2\" stroke-linecap=\"round\"><rect x=\"3\" y=\"4.5\" width=\"18\" height=\"17\" rx=\"3\"><\u002Frect><path d=\"M3 9h18M8 2.5v4M16 2.5v4\"><\u002Fpath><\u002Fsvg>\n              <\u002Fdiv>\n            <\u002Fdiv>\n            <div style=\"margin-top:16px;display:flex;align-items:center;justify-content:space-between\">\n              <sc-if value=\"{{ d.hasData }}\" hint-placeholder-val=\"{{ true }}\">\n                <span style=\"display:inline-flex;align-items:center;gap:7px;padding:5px 12px;border-radius:99px;background:color-mix(in srgb,var(--blue) 14%,transparent);color:var(--blue);font-size:12.5px;font-weight:700\">\n                  <span style=\"width:7px;height:7px;border-radius:50%;background:var(--blue)\"><\u002Fspan>{{ d.countText }}\n                <\u002Fspan>\n                <svg width=\"18\" height=\"18\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"var(--blue)\" stroke-width=\"2.2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M5 12h14M13 6l6 6-6 6\"><\u002Fpath><\u002Fsvg>\n              <\u002Fsc-if>\n              <sc-if value=\"{{ d.noData }}\" hint-placeholder-val=\"{{ true }}\">\n                <span style=\"font-size:12.5px;color:var(--ink3);font-weight:500\">ยังไม่มีข้อมูล<\u002Fspan>\n              <\u002Fsc-if>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n    <\u002Fsection>\n  <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <!-- ============ LIST ============ -->\n  <sc-if value=\"{{ isList }}\" hint-placeholder-val=\"{{ true }}\">\n  <div style=\"animation:fadeUp .45s ease\">\n    <div style=\"display:flex;align-items:center;gap:10px;margin-top:24px;font-size:13.5px;color:var(--ink2)\">\n      <span onclick=\"{{ goHome }}\" style=\"cursor:pointer;font-weight:600\">หน้าแรก<\u002Fspan>\n      <span style=\"color:var(--ink3)\">/<\u002Fspan>\n      <span style=\"color:var(--ink);font-weight:600\">{{ date.label }} · {{ date.session }}<\u002Fspan>\n    <\u002Fdiv>\n    <div style=\"display:flex;flex-wrap:wrap;align-items:baseline;gap:12px;margin-top:12px\">\n      <h2 style=\"margin:0;font-size:26px;font-weight:700\">รายชื่อสมาคมกีฬาฯ<\u002Fh2>\n    <\u002Fdiv>\n    <p style=\"margin:6px 0 22px;font-size:13.5px;color:var(--ink2)\">เลือกสมาคมเพื่อดูผลการวิเคราะห์คำขอโดยละเอียด<\u002Fp>\n\n    <div style=\"display:grid;gap:14px\">\n      <sc-for list=\"{{ listItems }}\" as=\"it\" hint-placeholder-count=\"8\">\n        <div onclick=\"{{ it.open }}\" style=\"background:var(--surface);border:1px solid var(--border);border-radius:20px;box-shadow:var(--shadow);padding:20px 22px;cursor:pointer;display:flex;gap:20px;align-items:center;transition:transform .18s ease,box-shadow .18s ease,border-color .18s ease\" style-hover=\"transform:translateY(-3px);box-shadow:0 24px 48px rgba(28,40,95,.16);border-color:color-mix(in srgb,var(--blue) 40%,var(--border))\">\n          <div style=\"width:56px;height:56px;border-radius:15px;background:var(--grad);display:flex;align-items:center;justify-content:center;flex:none;box-shadow:0 8px 20px rgba(28,40,95,.22)\">\n            <svg width=\"26\" height=\"26\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#fff\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M12 2l2.4 5 5.6.8-4 3.9 1 5.6L12 20l-5 2.3 1-5.6-4-3.9 5.6-.8z\"><\u002Fpath><\u002Fsvg>\n          <\u002Fdiv>\n          <div style=\"flex:1;min-width:0\">\n            <div style=\"font-size:clamp(17px,2.4vw,21px);font-weight:700;line-height:1.3;letter-spacing:-.2px\">{{ it.agency }}<\u002Fdiv>\n            <div style=\"font-size:13.5px;color:var(--ink2);font-weight:500;margin-top:5px\">{{ it.short }}<\u002Fdiv>\n            <div style=\"display:flex;flex-wrap:wrap;gap:8px 16px;font-size:12.5px;color:var(--ink3);margin-top:8px\">\n              <span>เลขที่ {{ it.doc }}<\u002Fspan>\n              <span>·<\u002Fspan>\n              <span>งบที่ขอ {{ it.budget }} บาท<\u002Fspan>\n              <span>·<\u002Fspan>\n              <span>{{ it.period }}<\u002Fspan>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"flex:none;width:42px;height:42px;border-radius:50%;background:var(--surface2);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;transition:background .18s ease\">\n            <svg width=\"20\" height=\"20\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"var(--blue)\" stroke-width=\"2.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M9 6l6 6-6 6\"><\u002Fpath><\u002Fsvg>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsc-for>\n    <\u002Fdiv>\n  <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <!-- ============ DETAIL ============ -->\n  <sc-if value=\"{{ isDetail }}\" hint-placeholder-val=\"{{ true }}\">\n  <div style=\"animation:fadeUp .45s ease\">\n    <div style= align-items:center;justify-content:center;flex:none\"><div style=\"font-size:15px;font-weight:700;line-height:1\">{{ budget.pct }}%<\u002Fdiv><\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"display:flex;gap:16px;font-size:11.5px;color:var(--ink3);margin:12px 0 4px\"><span style=\"display:inline-flex;align-items:center;gap:6px\"><span style=\"width:14px;height:8px;border-radius:3px;background:var(--border)\"><\u002Fspan>งบที่ขอ<\u002Fspan><span style=\"display:inline-flex;align-items:center;gap:6px\"><span style=\"width:14px;height:8px;border-radius:3px;background:var(--ok)\"><\u002Fspan>วงเงินแนะนำ<\u002Fspan><\u002Fdiv>\n        <sc-for list=\"{{ budget.items }}\" as=\"it\" hint-placeholder-count=\"7\">\n          <div style=\"padding:15px 0;border-top:1px solid var(--border)\">\n            <div style=\"display:flex;justify-content:space-between;gap:12px;align-items:baseline\">\n              <div style=\"font-size:13.5px;font-weight:600;line-height:1.4;display:flex;align-items:center;gap:8px;flex-wrap:wrap\">{{ it.name }}<sc-if value=\"{{ it.flag }}\" hint-placeholder-val=\"{{ true }}\"><span style=\"padding:2px 9px;border-radius:99px;font-size:10.5px;font-weight:700;color:var(--bad);background:color-mix(in srgb,var(--bad) 14%,transparent)\">ตั้งข้อสังเกต<\u002Fspan><\u002Fsc-if><\u002Fdiv>\n              <div style=\"flex:none;font-weight:700;font-variant-numeric:tabular-nums;color:{{ it.pctColor }}\">{{ it.pct }}%<\u002Fdiv>\n            <\u002Fdiv>\n            <div style=\"position:relative;height:12px;border-radius:99px;background:var(--surface2);overflow:hidden;margin:9px 0 7px\">\n              <div style=\"position:absolute;top:0;bottom:0;left:0;border-radius:99px;background:var(--border);{{ it.reqStyle }}\"><\u002Fdiv>\n              <div style=\"position:absolute;top:0;bottom:0;left:0;border-radius:99px;transition:width .6s ease;{{ it.appStyle }}\"><\u002Fdiv>\n            <\u002Fdiv>\n            <div style=\"display:flex;flex-wrap:wrap;justify-content:space-between;gap:8px;font-size:12px;color:var(--ink2)\">\n              <span>ขอ {{ it.reqFmt }} → อนุมัติ <b style=\"color:var(--ink)\">{{ it.appFmt }}<\u002Fb> บาท<\u002Fspan>\n              <span style=\"padding:2px 10px;border-radius:99px;background:var(--surface2);border:1px solid var(--border);font-size:11px;font-weight:600\">{{ it.statusTh }}<\u002Fspan>\n            <\u002Fdiv>\n            <div style=\"font-size:12px;color:var(--ink2);margin-top:7px;line-height:1.6\">{{ it.assess }}<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <\u002Fsc-if>\n\n    <!-- ---- RED FLAGS ---- -->\n    <sc-if value=\"{{ sec.risk }}\" hint-placeholder-val=\"{{ true }}\">\n    <div style=\"animation:fadeUp .4s ease;margin-top:20px\">\n      <div style=\"display:flex;gap:12px;margin-bottom:16px;flex-wrap:wrap\">\n        <div style=\"flex:1;min-width:120px;background:var(--surface);border:1px solid var(--border);border-radius:16px;box-shadow:var(--shadow);padding:16px;text-align:center\"><div style=\"font-size:28px;font-weight:700;color:var(--bad)\">{{ flagsCount.high }}<\u002Fdiv><div style=\"font-size:12px;color:var(--ink2);font-weight:600\">ความเสี่ยงสูง<\u002Fdiv><\u002Fdiv>\n        <div style=\"flex:1;min-width:120px;background:var(--surface);border:1px solid var(--border);border-radius:16px;box-shadow:var(--shadow);padding:16px;text-align:center\"><div style=\"font-size:28px;font-weight:700;color:var(--warn)\">{{ flagsCount.medium }}<\u002Fdiv><div style=\"font-size:12px;color:var(--ink2);font-weight:600\">ความเสี่ยงกลาง<\u002Fdiv><\u002Fdiv>\n        <div style=\"flex:1;min-width:120px;background:var(--surface);border:1px solid var(--border);border-radius:16px;box-shadow:var(--shadow);padding:16px;text-align:center\"><div style=\"font-size:28px;font-weight:700;color:var(--ink2)\">{{ flagsCount.low }}<\u002Fdiv><div style=\"font-size:12px;color:var(--ink2);font-weight:600\">ความเสี่ยงต่ำ<\u002Fdiv><\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"display:grid;gap:12px\">\n        <sc-for list=\"{{ flags }}\" as=\"f\" hint-placeholder-count=\"8\">\n          <div style=\"background:{{ f.cardBg }};border:1px solid var(--border);border-left:4px solid {{ f.color }};border-radius:16px;box-shadow:var(--shadow);padding:18px 20px\">\n            <div style=\"display:flex;gap:12px;align-items:flex-start\">\n              <div style=\"flex:none;display:flex;flex-direction:column;align-items:center;gap:5px\">\n                <svg width=\"22\" height=\"22\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"{{ f.color }}\" stroke-width=\"2.2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M4 22V4M4 4h13l-2 4 2 4H4\"><\u002Fpath><\u002Fsvg>\n                <span style=\"font-size:10px;font-weight:700;color:var(--ink3)\">{{ f.code }}<\u002Fspan>\n              <\u002Fdiv>\n              <div style=\"flex:1\">\n                <div style=\"display:flex;justify-content:space-between;gap:10px;align-items:flex-start;flex-wrap:wrap\"><span style=\"font-size:14.5px;font-weight:700;line-height:1.4\">{{ f.title }}<\u002Fspan><span style=\"flex:none;padding:3px 12px;border-radius:99px;font-size:11.5px;font-weight:700;color:#fff;background:{{ f.chip }};box-shadow:inset 0 1px 0 rgba(255,255,255,.4),0 2px 7px rgba(0,0,0,.13)\">{{ f.sevTh }}<\u002Fspan><\u002Fdiv>\n                <div style=\"font-size:13px;color:var(--ink2);margin-top:6px;line-height:1.7\">{{ f.detail }}<\u002Fdiv>\n                <div style=\"font-size:11.5px;color:var(--ink3);margin-top:8px\">เกี่ยวข้อง: {{ f.steps }}<\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <\u002Fsc-if>\n\n    <div style=\"margin-top:26px;text-align:center;font-size:12px;color:var(--ink3)\">รหัสวิเคราะห์ {{ r.analysisId }}<\u002Fdiv>\n  <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <\u002Fmain>\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\">\nclass Component extends DCLogic {\n  state = { view:'home', theme:'dark', dateId:null, reqId:null, section:'overview' };\n  D(){ return window.NSDF_DATA || {dates:[],requests:{}}; }\n  fmt(n){ return (n==null)?'—':Number(n).toLocaleString('en-US'); }\n  // quality: HIGH/GOOD good(green) LOW/POOR bad(red) else warn\n  qv(l){ l=(l||'').toUpperCase(); if(['HIGH','GOOD','COMPLIANT'].indexOf(l)>=0)return'var(--ok)'; if(['LOW','POOR','MISSING_ALL','AT_RISK'].indexOf(l)>=0)return'var(--bad)'; return'var(--warn)'; }\n  // risk: HIGH bad LOW ok else warn\n  rv(l){ l=(l||'').toUpperCase(); if(l==='HIGH')return'var(--bad)'; if(l==='LOW')return'var(--ok)'; return'var(--warn)'; }\n  gloss(c){ return 'linear-gradient(180deg,rgba(255,255,255,.30),rgba(255,255,255,.05) 58%,rgba(0,0,0,.05)),'+c; }\n  qc(l){ l=(l||'').toUpperCase(); if(['HIGH','GOOD','COMPLIANT'].indexOf(l)>=0)return this.gloss('var(--ok-s)'); if(['LOW','POOR','MISSING_ALL','AT_RISK'].indexOf(l)>=0)return this.gloss('var(--bad-s)'); return this.gloss('var(--warn-s)'); }\n  rc(l){ l=(l||'').toUpperCase(); if(l==='HIGH')return this.gloss('var(--bad-s)'); if(l==='LOW')return this.gloss('var(--ok-s)'); return this.gloss('var(--warn-s)'); }\n\n  renderVals(){\n    const st=this.state, D=this.D();\n    const b={\n      theme:st.theme, isLight:st.theme==='light', isDark:st.theme==='dark',\n      isHome:st.view==='home', isList:st.view==='list', isDetail:st.view==='detail',\n      goHome:()=>this.setState({view:'home',dateId:null,reqId:null}),\n      backToList:()=>this.setState({view:'list',reqId:null}),\n      toggleTheme:()=>this.setState(s=>({theme:s.theme==='light'?'dark':'light'})),\n    };\n\n    // HOME\n    const allR=Object.values(D.requests);\n    const sum=f=>allR.reduce((a,x)=>a+(f(x)||0),0);\n    b.dates=D.dates.map(d=>({\n      id:d.id, label:d.label, session:d.session,\n      hasData:d.requests.length>0, noData:d.requests.length===0,\n      countText:d.requests.length+' สมาคม',\n      open:()=>{ if(d.requests.length>0) this.setState({view:'list',dateId:d.id}); }\n    }));\n    b.ov={\n      total:allR.length,\n      budget:this.fmt(sum(x=>x.request.budget_requested)),\n      recommend:this.fmt(sum(x=>x.summary.recommend_amount)),\n      avgPct: allR.length?(sum(x=>x.summary.recommend_pct)/allR.length).toFixed(1):'0',\n      high:allR.filter(x=>x.summary.risk_level==='HIGH').length,\n      medium:allR.filter(x=>x.summary.risk_level==='MEDIUM').length,\n      low:allR.filter(x=>x.summary.risk_level==='LOW').length,\n    };\n\n    // LIST\n    const dObj=D.dates.find(d=>d.id===st.dateId);\n    b.date=dObj?{label:dObj.label,session:dObj.session,count:dObj.requests.length}:{label:'',session:'',count:0};\n    b.listItems=dObj?dObj.requests.map(id=>{const r=D.requests[id];return{\n      id, name:r.request.project_name, short:r.request.short_name, agency:r.request.agency,\n      doc:r.request.doc_no, budget:this.fmt(r.request.budget_requested), period:r.request.period_th,\n      riskTh:r.summary.risk_level_th, riskColor:this.rv(r.summary.risk_level), score:r.summary.risk_score,\n      pct:r.summary.recommend_pct, recommend:this.fmt(r.summary.recommend_amount),\n      open:()=>this.setState({view:'detail',reqId:id,section:'overview'}),\n    };}):[];\n\n    // DETAIL\n    const r = (st.view==='detail')?D.requests[st.reqId]:null;\n    if(r){\n      const s=r.summary, rq=r.request, C=326.7;\n      b.r={ name:rq.project_name, short:rq.short_name, agency:rq.agency, doc:rq.doc_no,\n        fy:rq.fiscal_year_be, period:rq.period_th, plan:rq.plan_name,\n        analyzedBy:r.analysis_meta.analyzed_by, analysisId:r.analysis_meta.analysis_id };\n      b.sm={ exec:s.executive_summary, riskTh:s.risk_level_th,\n        recommendAmt:this.fmt(s.recommend_amount), budgetReq:this.fmt(rq.budget_requested),\n        complete:s.completeness_level_th, completeColor:this.qv(s.completeness_level), completeChip:this.qc(s.completeness_level),\n        align:s.alignment_level_th, alignColor:this.qv(s.alignment_level), alignChip:this.qc(s.alignment_level),\n        results:s.results_level_th, resultsColor:this.qv(s.results_level), resultsChip:this.qc(s.results_level) };\n      b.riskGauge={ score:s.risk_score, dash:(s.risk_score/100*C).toFixed(1)+' '+C.toFixed(1) };\n      b.recGauge={ pct:s.recommend_pct, dash:(s.recommend_pct/100*C).toFixed(1)+' '+C.toFixed(1) };\n\n      // tabs\n      const tabDefs=[['overview','ภาพรวม'],['analysis','การวิเคราะห์'],['align','ความสอดคล้อง & ผลสัมฤทธิ์'],['budget','งบประมาณ'],['risk','ธงความเสี่ยง']];\n      b.tabs=tabDefs.map(([id,label])=>({id,label,go:()=>this.setState({section:id}),\n        bg: st.section===id?'var(--grad)':'transparent', fg: st.section===id?'#fff':'var(--ink2)'}));\n      b.sec={ overview:st.section==='overview', analysis:st.section==='analysis', align:st.section==='align', budget:st.section==='budget', risk:st.section==='risk' };\n\n      // facts / legal / double / completeness\n      b.facts=r.step1_extraction.facts.map(f=>({label:f.label,value:f.value}));\n      b.factsNote=r.step1_extraction.note;\n      b.legal={ levelTh:r.step2_legal.level_th, color:this.rv(r.step2_legal.level), chip:this.rc(r.step2_legal.level),\n        summary:r.step2_legal.summary, verdict:r.step2_legal.verdict,\n        points:r.step2_legal.points.map(p=>({aspect:p.aspect,statusTh:p.status_th,color:this.qv(p.status),chip:this.qc(p.status),detail:p.detail})) };\n      b.dbl={ levelTh:r.step3_double_count.level_th, color:this.rv(r.step3_double_count.level), chip:this.rc(r.step3_double_count.level),\n        summary:r.step3_double_count.summary, action:r.step3_double_count.required_action,\n        overlaps:r.step3_double_count.overlap_items.map(o=>({name:o.item_name,amount:this.fmt(o.amount),reason:o.reason})) };\n      b.comp={ levelTh:r.step4_completeness.level_th, color:this.qv(r.step4_completeness.level), chip:this.qc(r.step4_completeness.level), score:r.step4_completeness.score,\n        present:r.step4_completeness.present.map(p=>({item:p.item})),\n        missing:r.step4_completeness.missing.map(m=>{ const lv=(m.severity==='MISSING_ALL')?'HIGH':((m.severity==='MISSING')?'MEDIUM':'LOW'); return {item:m.item, sevTh:m.severity_th, color:this.rv(lv), chip:this.rc(lv), reason:m.reason}; }) };\n\n      // radar step5\n      const M=r.step5_alignment.matrix, n=M.length, cx=200, cy=172, R=104;\n      const lv=l=>({HIGH:3,MEDIUM:2,LOW:1}[(l||'').toUpperCase()]||1);\n      const P=(i,rad)=>{const a=(-90+i*360/n)*Math.PI/180;return [cx+Math.cos(a)*rad, cy+Math.sin(a)*rad];};\n      const short={\n        FUND_OBJECTIVE:['วัตถุประสงค์','กองทุน'],\n        SPORT_PLUS:['Sport Plus'],\n        NATIONAL_SPORT_PLAN_7:['แผนพัฒนากีฬา','ชาติ ฉ.7'],\n        NATIONAL_STRATEGY_20Y:['ยุทธศาสตร์','ชาติ 20 ปี'],\n        SAT_ENTERPRISE_PLAN:['แผนวิสาหกิจ','กกท.'],\n      };\n      b.radar={\n        points: M.map((x,i)=>{const p=P(i,R*lv(x.level)/3);return p[0].toFixed(1)+','+p[1].toFixed(1);}).join(' '),\n        rings:[1,2,3].map(k=>({pts:M.map((x,i)=>{const p=P(i,R*k/3);return p[0].toFixed(1)+','+p[1].toFixed(1);}).join(' ')})),\n        axes:M.map((x,i)=>{const p=P(i,R);return {x1:cx,y1:cy,x2:p[0].toFixed(1),y2:p[1].toFixed(1)};}),\n        scale:[{y:(cy-R/3).toFixed(1),t:'ต่ำ'},{y:(cy-R*2/3).toFixed(1),t:'กลาง'},{y:(cy-R).toFixed(1),t:'สูง'}],\n        nodes:M.map((x,i)=>{\n          const dp=P(i,R*lv(x.level)/3), lp=P(i,R+30);\n          const anc=Math.abs(lp[0]-cx)<12?'middle':(lp[0]>cx?'start':'end');\n          const names=short[x.dimension_code]||[x.dimension_code];\n          return { dx:dp[0].toFixed(1), dy:dp[1].toFixed(1), num:i+1, color:this.qv(x.level),\n            lx:lp[0].toFixed(1), ly:(lp[1]-(names.length-1)*7).toFixed(1), anchor:anc,\n            lines:names.map((t,idx)=>({t, dy:(idx===0?0:14)+''})), levelTh:x.level_th };\n        }),\n      };\n      b.matrix=M.map((x,i)=>({num:i+1,dim:x.dimension,levelTh:x.level_th,color:this.qv(x.level),chip:this.qc(x.level),exp:x.explanation}));\n      b.alignOverall={ level:r.step5_alignment.overall_level_th, color:this.qv(r.step5_alignment.overall_level), chip:this.qc(r.step5_alignment.overall_level),\n        problem:r.step5_alignment.problem_statement, necessity:r.step5_alignment.necessity };\n\n      // 4E\n      b.fourE=r.step8_four_e.map(e=>({ name:e.dimension_th, levelTh:e.level_th, color:this.qv(e.level), chip:this.qc(e.level),\n        w:({HIGH:100,MEDIUM:64,LOW:32}[(e.level||'').toUpperCase()]||32)+'%', analysis:e.analysis, rec:e.recommendation }));\n\n      // results step6\n      b.results=r.step6_results.indicators.map(i=>({ ind:i.indicator, target:i.target||'—',\n        baseline:i.baseline||'ไม่มี baseline', ratingTh:i.rating_th, color:this.qv(i.rating), chip:this.qc(i.rating), rec:i.recommendation }));\n      b.resultsNote=r.step6_results.note;\n      b.resultsLevel={ levelTh:r.step6_results.level_th, color:this.qv(r.step6_results.level), chip:this.qc(r.step6_results.level) };\n\n      // budget step7\n      const items=r.step7_budget.items, maxA=Math.max.apply(null,items.map(i=>i.amount_requested||0))||1;\n      b.budget={ totalReq:this.fmt(r.step7_budget.total_requested), totalRec:this.fmt(r.step7_budget.total_recommended),\n        pct:r.step7_budget.recommend_pct,\n        items:items.map(it=>{ const ac=it.approve_pct>=100?'var(--ok)':(it.approve_pct<=50?'var(--bad)':'var(--warn)');\n          return { name:it.item_name, statusTh:it.boq_status_th, reqFmt:this.fmt(it.amount_requested),\n            appFmt:this.fmt(it.approve_amount), pct:it.approve_pct, flag:it.is_flagged, assess:it.assessment,\n            reqStyle:'width:'+(it.amount_requested/maxA*100).toFixed(1)+'%',\n            appStyle:'width:'+(it.approve_amount/maxA*100).toFixed(1)+'%;background:'+ac, pctColor:ac };\n        }) };\n\n      // red flags\n      b.flags=r.red_flags.map(f=>{ const col=this.rv(f.severity); return { code:f.code, sevTh:f.severity_th, color:col, chip:this.rc(f.severity),\n        cardBg:'linear-gradient(105deg,color-mix(in srgb,'+col+' 9%,var(--surface)) 0%,var(--surface) 58%)',\n        title:f.title, detail:f.detail, steps:(f.related_steps||[]).map(x=>'ขั้นที่ '+x).join(' · ') }; });\n      b.flagsCount={ high:r.red_flags.filter(f=>f.severity==='HIGH').length,\n        medium:r.red_flags.filter(f=>f.severity==='MEDIUM').length, low:r.red_flags.filter(f=>f.severity==='LOW').length };\n    }\n    return b;\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
